<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Santa & Milestones</title>
<style>
:root{--brand:#2A78D6}body{font-family:system-ui,sans-serif;margin:0;background:#FAFAF9;color:#18181B}
header{background:var(--brand);color:#fff;padding:14px 20px}header h1{margin:0;font-size:20px}
main{max-width:960px;margin:auto;padding:16px}section{background:#fff;border:1px solid #DEDDD8;border-radius:8px;padding:14px;margin-bottom:14px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #DEDDD8;padding:6px;text-align:left;font-size:14px}
button{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;margin:2px}
button.sec{background:#888}input,select,textarea{padding:6px;margin:2px}.err{color:#b00}.ok{color:#080}.hidden{display:none}
</style></head><body>
<header><h1 id="title">Secret Santa & Milestones</h1></header>
<main>
<nav><button onclick="tab('people')">People</button><button onclick="tab('santa')">Secret Santa</button><button onclick="tab('miles')">Milestones</button><button onclick="tab('brand')">Branding</button></nav><br>
<div id="people" class="tab"><section><h3>People</h3>
<input id="pName" placeholder="Name"><input id="pDept" placeholder="Department"><input id="pEmail" placeholder="Email">
<label>Start <input id="pStart" type="date"></label><label>Birthday <input id="pBday" type="date"></label>
<input id="pLikes" placeholder="Interests (comma)"><button onclick="addPerson()">Add</button>
<p><label>Import CSV (name,department,email,start,birthday,interests): <input type="file" accept=".csv" onchange="importCsv(this)"></label> <button class="sec" onclick="loadDemo()">Load demo data</button></p>
<table id="pTable"></table></section></div>
<div id="santa" class="tab hidden"><section><h3>Rules</h3>
<label>Budget $<input id="rBudget" type="number" style="width:80px"></label>
<label>Exchange date <input id="rDate" type="date"></label>
<label><input id="rDept" type="checkbox"> No matches inside the same department</label><br>
<label>Never pair, one per line ("Ann = Bob" both ways, "Ann > Bob" one way):<br><textarea id="rEx" rows="3" cols="50"></textarea></label><br>
<label>Last year's pairs to avoid ("Giver > Receiver"):<br><textarea id="rLast" rows="3" cols="50"></textarea></label><br>
<button onclick="saveRules();assign()">Auto-assign</button> <button class="sec" onclick="exportPairs()">Export CSV</button>
<p id="sMsg"></p><table id="sTable"></table></section></div>
<div id="miles" class="tab hidden"><section><h3>Upcoming milestones</h3>
<label>Next <select id="mDays"><option>30</option><option selected>60</option><option>90</option><option>365</option></select> days</label>
<label>Gift budget $<input id="mBudget" type="number" value="50" style="width:80px"></label><button onclick="renderMiles()">Refresh</button>
<table id="mTable"></table></section></div>
<div id="brand" class="tab hidden"><section><h3>White-label branding</h3>
<input id="bName" placeholder="Company name"><input id="bColor" type="color" value="#2A78D6"><button onclick="saveBrand()">Save</button>
<p>All data stays in this browser (localStorage).</p><button class="sec" onclick="if(confirm('Clear all data?')){localStorage.removeItem('ssm');location.reload()}">Reset all data</button></section></div>
</main>
<script src="app.js"></script>
</body></html>
